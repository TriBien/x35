k.md\n```\n\n### Final oral defense\n\nAnswer these without looking at notes:\n\n1. What problem does the system solve?\n2. What are its invariants?\n3. Where are its boundaries?\n4. Where is state stored?\n5. How does a request travel through the system?\n6. What happens at the CPU level?\n7. What happens in memory?\n8. What does the runtime do?\n9. What happens in the OS?\n10. What happens over the network?\n11. What happens inside PostgreSQL?\n12. What happens when two requests race?\n13. What happens when a dependency fails?\n14. What happens when traffic increases 10x?\n15. What is the dominant bottleneck?\n16. What is the most expensive resource?\n17. What is the weakest reliability assumption?\n18. What security boundary matters most?\n19. Which abstraction provides the most value?\n20. Which abstraction adds unnecessary complexity?\n21. What would you remove if forced to simplify the system by 50%?\n22. What would you keep if only the fundamental behavior mattered?\n\n### Final mastery test\n\nFor each major concept, prove all five levels:\n\n```text\nLEVEL 1 — Explain\n        ↓\nLEVEL 2 — Implement\n        ↓\nLEVEL 3 — Break\n        ↓\nLEVEL 4 — Measure\n        ↓\nLEVEL 5 — Transfer\n```\n\nThe final objective is not:\n\n> \"I know React, Node, Java, Spring, PostgreSQL, Go, Rust and Python.\"\n\nIt is:\n\n> \"I can recognize the same underlying computational idea regardless of the technology implementing it.\""}]}
</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('roadmap-data').textContent);
  var PHASES = DATA.phases;      // [{num,months,theme}]
  var MONTHS = DATA.months;      // [{num,theme,phase}]
  var WEEKS = DATA.weeks;        // [{num,title,month,phase,fundamental,deliverable,body}]

  var STORE_KEY = 'ffroadmap_progress_v1';
  var UI_KEY = 'ffroadmap_ui_v1';

  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveProgress(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){}
  }
  function loadUI(){
    try{
      var raw = localStorage.getItem(UI_KEY);
      return raw ? JSON.parse(raw) : {openPhases:{}, openMonths:{}};
    }catch(e){ return {openPhases:{}, openMonths:{}}; }
  }
  function saveUI(){
    try{ localStorage.setItem(UI_KEY, JSON.stringify(ui)); }catch(e){}
  }

  var progress = loadProgress(); // { weekNum: {status:'not_started'|'in_progress'|'done', score:null|number, notes:''} }
  var ui = loadUI();

  function getEntry(weekNum){
    if(!progress[weekNum]){
      progress[weekNum] = {status:'not_started', score:null, notes:''};
    }
    return progress[weekNum];
  }

  function monthsByPhase(phaseNum){
    return MONTHS.filter(function(m){ return m.phase === phaseNum; });
  }
  function weeksByMonth(monthNum){
    return WEEKS.filter(function(w){ return w.month === monthNum; });
  }

  function phaseStats(phaseNum){
    var ws = WEEKS.filter(function(w){ return w.phase === phaseNum; });
    var done = 0, prog = 0;
    ws.forEach(function(w){
      var e = progress[w.num];
      if(e){ if(e.status==='done') done++; else if(e.status==='in_progress') prog++; }
    });
    return {total: ws.length, done: done, progress: prog};
  }
  function monthStats(monthNum){
    var ws = weeksByMonth(monthNum);
    var done=0, prog=0;
    ws.forEach(function(w){
      var e = progress[w.num];
      if(e){ if(e.status==='done') done++; else if(e.status==='in_progress') prog++; }
    });
    return {total: ws.length, done: done, progress: prog};
  }

  function overallStats(){
    var done=0, prog=0, scores=[];
    WEEKS.forEach(function(w){
      var e = progress[w.num];
      if(e){
        if(e.status==='done') done++;
        else if(e.status==='in_progress') prog++;
        if(e.score !== null && e.score !== undefined && e.score !== '') scores.push(Number(e.score));
      }
    });
    var avg = scores.length ? Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length) : null;
    return {total: WEEKS.length, done: done, progress: prog, avg: avg};
  }

  var currentWeek = null; // week number, null = dashboard

  /* ---------------- Sidebar tree ---------------- */
  var treeEl = document.getElementById('tree');

  function buildTree(){
    treeEl.innerHTML = '';
    PHASES.forEach(function(ph){
      var pStats = phaseStats(ph.num);
      var pctP = pStats.total ? Math.round((pStats.done/pStats.total)*100) : 0;

      var block = document.createElement('div');
      block.className = 'phase-block';

      var head = document.createElement('div');
      head.className = 'phase-head' + (ui.openPhases[ph.num] ? ' open' : '');
      head.innerHTML =
        '<span class="chev">&#9656;</span>' +
        '<span class="phase-roman">'+ph.num+'</span>' +
        '<span class="phase-info"><div class="phase-name">Months '+ph.months+'</div>' +
        '<div class="phase-theme" title="'+escapeHtml(ph.theme)+'">'+escapeHtml(ph.theme)+'</div></span>' +
        '<span class="phase-pct">'+pctP+'%</span>';
      block.appendChild(head);

      var monthList = document.createElement('div');
      monthList.className = 'month-list' + (ui.openPhases[ph.num] ? ' open' : '');

      monthsByPhase(ph.num).forEach(function(m){
        var mStats = monthStats(m.num);
        var monthBlock = document.createElement('div');
        monthBlock.className = 'month-block';

        var mHead = document.createElement('div');
        var mKey = 'm'+m.num;
        mHead.className = 'month-head' + (ui.openMonths[mKey] ? ' open' : '');
        var dotsHtml = weeksByMonth(m.num).map(function(w){
          var e = progress[w.num];
          var cls = e && e.status==='done' ? 'done' : (e && e.status==='in_progress' ? 'progress' : '');
          return '<span class="mini-dot '+cls+'"></span>';
        }).join('');
        mHead.innerHTML =
          '<span class="chev">&#9656;</span>' +
          '<span class="month-num">M'+m.num+'</span>' +
          '<span class="month-info"><div class="month-theme" title="'+escapeHtml(m.theme)+'">'+escapeHtml(m.theme)+'</div>' +
          '<div class="month-dot-row">'+dotsHtml+'</div></span>';
        monthBlock.appendChild(mHead);

        var weekList = document.createElement('div');
        weekList.className = 'week-list' + (ui.openMonths[mKey] ? ' open' : '');

        weeksByMonth(m.num).forEach(function(w){
          var e = progress[w.num];
          var statusCls = e && e.status==='done' ? 'done' : (e && e.status==='in_progress' ? 'progress' : '');
          var item = document.createElement('div');
          item.className = 'week-item' + (currentWeek===w.num ? ' selected' : '');
          item.setAttribute('data-week', w.num);
          item.setAttribute('data-search', (w.num+' '+w.title+' '+w.fundamental).toLowerCase());
          item.innerHTML =
            '<span class="week-status-dot '+statusCls+'"></span>' +
            '<span class="week-item-text"><span class="week-item-num">W'+pad2(w.num)+'</span> ' +
            '<span class="week-item-title">'+escapeHtml(w.title)+'</span></span>';
          item.addEventListener('click', function(){ selectWeek(w.num); });
          weekList.appendChild(item);
        });

        mHead.addEventListener('click', function(){
          ui.openMonths[mKey] = !ui.openMonths[mKey];
          saveUI();
          mHead.classList.toggle('open');
          weekList.classList.toggle('open');
        });

        monthBlock.appendChild(weekList);
        monthList.appendChild(monthBlock);
      });

      head.addEventListener('click', function(){
        ui.openPhases[ph.num] = !ui.openPhases[ph.num];
        saveUI();
        head.classList.toggle('open');
        monthList.classList.toggle('open');
      });

      block.appendChild(monthList);
      treeEl.appendChild(block);
    });
  }

  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------------- Header stats ---------------- */
  function renderHeader(){
    var s = overallStats();
    var pct = s.total ? Math.round((s.done/s.total)*100) : 0;
    document.getElementById('stat-pct').textContent = pct+'%';
    document.getElementById('stat-done').textContent = s.done;
    document.getElementById('stat-progress').textContent = s.progress;
    document.getElementById('stat-avg').textContent = s.avg===null ? '—' : s.avg;
    document.getElementById('stat-remaining').textContent = s.total - s.done;
    document.getElementById('progress-bar').style.width = pct+'%';
  }

  /* ---------------- Dashboard ---------------- */
  function renderDashboard(){
    var mainEl = document.getElementById('main');
    var html = '<div class="dash">';
    html += '<h1>Mission Control</h1>';
    html += '<p class="lede">A durable engineering foundation, tracked week by week. Click any cell in the memory map or any week in the sidebar to open it, log a status and score, and keep notes.</p>';

    html += '<div class="memmap-title">Progress Memory Map <span class="legend"><span><i class="empty"></i>Not started</span><span><i class="prog"></i>In progress</span><span><i class="done"></i>Done</span></span></div>';
    html += '<div class="memmap">';
    WEEKS.forEach(function(w){
      var e = progress[w.num];
      var cls = e && e.status==='done' ? 'done' : (e && e.status==='in_progress' ? 'progress' : '');
      html += '<div class="mem-cell '+cls+'" data-week="'+w.num+'" title="Week '+w.num+' — '+escapeHtml(w.title)+'">'+pad2(w.num)+'</div>';
    });
    html += '</div>';

    html += '<div class="section-label">Phase Progress</div>';
    html += '<div class="phase-cards">';
    PHASES.forEach(function(ph){
      var st = phaseStats(ph.num);
      var pct = st.total ? Math.round((st.done/st.total)*100) : 0;
      html += '<div class="pcard">' +
        '<div class="pcard-top"><span class="pcard-roman">Phase '+ph.num+'</span><span class="pcard-pct">'+pct+'%</span></div>' +
        '<div class="pcard-theme">'+escapeHtml(ph.theme)+'</div>' +
        '<div class="pcard-bar"><div class="pcard-bar-inner" style="width:'+pct+'%"></div></div>' +
        '<div class="pcard-months">MONTHS '+ph.months+' &middot; '+st.done+'/'+st.total+' WEEKS</div>' +
        '</div>';
    });
    html += '</div>';

    html += '<div class="section-label">Backup Progress</div>';
    html += '<div class="notes-panel">';
    html += '<p style="margin:0 0 4px;color:var(--muted);font-size:12.5px;">All progress is saved automatically in this browser (localStorage). Export a backup before clearing browser data, or to move progress to another device.</p>';
    html += '<div class="data-buttons">' +
      '<button class="btn primary" id="btn-export">Export progress (.json)</button>' +
      '<button class="btn" id="btn-import">Import progress</button>' +
      '<button class="btn danger" id="btn-reset">Reset all progress</button>' +
      '</div>';
    html += '</div>';

    html += '<div class="footer-credit">Fundamentals-First Software Engineering Roadmap &middot; 24 months / 104 weeks &middot; Generated tracker — data embedded from source markdown.</div>';
    html += '</div>';

    mainEl.innerHTML = html;

    mainEl.querySelectorAll('.mem-cell').forEach(function(cell){
      cell.addEventListener('click', function(){
        selectWeek(Number(cell.getAttribute('data-week')));
      });
    });
    document.getElementById('btn-export').addEventListener('click', exportProgress);
    document.getElementById('btn-import').addEventListener('click', function(){
      document.getElementById('import-file').click();
    });
    document.getElementById('btn-reset').addEventListener('click', function(){
      if(confirm('This clears all status, scores, and notes for every week. This cannot be undone. Continue?')){
        progress = {};
        saveProgress();
        renderAll();
      }
    });
  }

  /* ---------------- Week detail ---------------- */
  function renderWeek(weekNum){
    var w = WEEKS.find(function(x){ return x.num === weekNum; });
    if(!w){ renderDashboard(); return; }
    var e = getEntry(weekNum);
    var mainEl = document.getElementById('main');

    var scoreTagHtml = '';
    if(e.score !== null && e.score !== '' && e.score !== undefined){
      var sc = Number(e.score);
      var cls = sc>=90?'mastery':(sc>=85?'strong':(sc>=75?'pass':'none'));
      var label = sc>=90?'MASTERY':(sc>=85?'STRONG':(sc>=75?'PASS':'BELOW PASS'));
      if(cls!=='none' || sc<75){
        scoreTagHtml = '<span class="score-tag '+(cls==='none'?'':cls)+'" style="'+(cls==='none'?'display:inline-block;background:var(--panel-2);color:var(--red);':'')+'">'+label+'</span>';
      }
    }

    var html = '<div class="week-detail">';
    html += '<div class="wd-eyebrow">Phase <b>'+w.phase+'</b> &middot; Month '+w.month+' &middot; Week '+pad2(w.num)+' of 104</div>';
    html += '<h1 class="wd-title">'+escapeHtml(w.title)+'</h1>';
    html += '<div class="wd-badges">';
    if(w.fundamental) html += '<span class="badge fund">Fundamental: '+escapeHtml(w.fundamental)+'</span>';
    if(w.deliverable) html += '<span class="badge deliv">Deliverable: '+escapeHtml(stripMd(w.deliverable))+'</span>';
    html += '</div>';

    html += '<div class="tracker-box"><div class="tracker-row">';
    html += '<div class="tracker-field"><label>Status</label><div class="status-btns">' +
      statusBtn('not_started','Not started',e.status) +
      statusBtn('in_progress','In progress',e.status) +
      statusBtn('done','Done',e.status) +
      '</div></div>';
    html += '<div class="tracker-field score-field"><label>Weekly score (0&ndash;100)</label>' +
      '<span><input type="number" min="0" max="100" id="score-input" value="'+(e.score===null||e.score===undefined?'':e.score)+'" placeholder="&ndash;">'+scoreTagHtml+'</span></div>';
    html += '</div></div>';

    html += '<div class="notes-panel"><label style="display:block;font-family:var(--mono);font-size:10px;color:var(--muted-2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;">Notes / evidence log</label>';
    html += '<textarea id="notes-input" placeholder="Question / Hypothesis / Result / What surprised me / What would break this design...">'+escapeHtml(e.notes||'')+'</textarea></div>';

    html += '<div class="md-body" id="md-body"></div>';

    var idx = WEEKS.findIndex(function(x){ return x.num===weekNum; });
    var prevW = idx>0 ? WEEKS[idx-1] : null;
    var nextW = idx<WEEKS.length-1 ? WEEKS[idx+1] : null;
    html += '<div class="wd-nav">';
    html += '<button class="nav-btn prev" id="nav-prev" '+(prevW?'':'disabled')+'><span class="lbl">&larr; PREVIOUS</span>'+(prevW?('W'+pad2(prevW.num)+' — '+escapeHtml(prevW.title)):'')+'</button>';
    html += '<button class="nav-btn next" id="nav-next" '+(nextW?'':'disabled')+'><span class="lbl">NEXT &rarr;</span>'+(nextW?('W'+pad2(nextW.num)+' — '+escapeHtml(nextW.title)):'')+'</button>';
    html += '</div>';

    html += '</div>';
    mainEl.innerHTML = html;

    document.getElementById('md-body').innerHTML = marked.parse(w.body);

    mainEl.querySelectorAll('.status-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        e.status = btn.getAttribute('data-s');
        saveProgress();
        renderAll();
      });
    });
    document.getElementById('score-input').addEventListener('change', function(ev){
      var v = ev.target.value;
      e.score = v==='' ? null : Math.max(0, Math.min(100, Number(v)));
      saveProgress();
      renderWeek(weekNum);
      renderHeaderAndTreeOnly();
    });
    document.getElementById('notes-input').addEventListener('input', function(ev){
      e.notes = ev.target.value;
      saveProgress();
    });
    if(prevW) document.getElementById('nav-prev').addEventListener('click', function(){ selectWeek(prevW.num); });
    if(nextW) document.getElementById('nav-next').addEventListener('click', function(){ selectWeek(nextW.num); });

    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  }

  function stripMd(s){
    return s.replace(/`/g,'').replace(/\*\*/g,'');
  }
  function statusBtn(val,label,current){
    return '<button class="status-btn'+(current===val?' active':'')+'" data-s="'+val+'">'+label+'</button>';
  }

  /* ---------------- Export / Import ---------------- */
  function exportProgress(){
    var blob = new Blob([JSON.stringify(progress, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'fundamentals-roadmap-progress.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  document.getElementById('import-file').addEventListener('change', function(ev){
    var file = ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        progress = parsed;
        saveProgress();
        renderAll();
        alert('Progress imported successfully.');
      }catch(err){
        alert('Could not read that file — make sure it is a progress JSON exported from this tracker.');
      }
    };
    reader.readAsText(file);
    ev.target.value = '';
  });

  /* ---------------- Search ---------------- */
  document.getElementById('search').addEventListener('input', function(ev){
    var q = ev.target.value.trim().toLowerCase();
    var items = document.querySelectorAll('.week-item');
    if(!q){
      items.forEach(function(it){ it.classList.remove('hidden'); });
      return;
    }
    // auto-expand everything while searching
    document.querySelectorAll('.phase-head').forEach(function(h){ h.classList.add('open'); });
    document.querySelectorAll('.month-list').forEach(function(h){ h.classList.add('open'); });
    document.querySelectorAll('.month-head').forEach(function(h){ h.classList.add('open'); });
    document.querySelectorAll('.week-list').forEach(function(h){ h.classList.add('open'); });
    items.forEach(function(it){
      var hay = it.getAttribute('data-search');
      it.classList.toggle('hidden', hay.indexOf(q) === -1);
    });
  });

  /* ---------------- View tabs ---------------- */
  document.getElementById('tab-dashboard').addEventListener('click', function(){
    currentWeek = null;
    setActiveTab('tab-dashboard');
    renderAll();
  });
  document.getElementById('tab-expand').addEventListener('click', function(){
    var anyOpen = Object.keys(ui.openPhases).some(function(k){ return ui.openPhases[k]; });
    PHASES.forEach(function(ph){ ui.openPhases[ph.num] = !anyOpen; });
    MONTHS.forEach(function(m){ ui.openMonths['m'+m.num] = !anyOpen; });
    saveUI();
    buildTree();
  });
  function setActiveTab(id){
    document.querySelectorAll('.view-tab').forEach(function(t){ t.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  /* ---------------- Selection & full render ---------------- */
  function selectWeek(weekNum){
    currentWeek = weekNum;
    // auto-expand relevant phase/month
    var w = WEEKS.find(function(x){ return x.num===weekNum; });
    if(w){
      ui.openPhases[w.phase] = true;
      ui.openMonths['m'+w.month] = true;
      saveUI();
    }
    renderAll();
  }

  function renderHeaderAndTreeOnly(){
    renderHeader();
    buildTree();
  }

  function renderAll(){
    renderHeader();
    buildTree();
    if(currentWeek === null){
      renderDashboard();
    }else{
      renderWeek(currentWeek);
    }
  }

  renderAll();
})();

</script>
</body>
</html>
